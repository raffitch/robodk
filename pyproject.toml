[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tasni"
version = "0.1.0"
description = "Robotic-fabrication control platform on RoboDK — pluggable workflow modules on a shared core (calibration is module #1)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-contrib-python",   # cv2.aruco (ChArUco) lives in contrib
    "scipy",                   # post-solve reprojection refinement
    "robodk>=6.0.1",           # RoboDK Python API (item Start dispatch; cell-proven)
    "fastapi",
    "uvicorn[standard]",
    "lz4",                     # depth frame decompression (scan module)
    "PyTurboJPEG",             # fast JPEG decode (optional; falls back to cv2)
]

[project.optional-dependencies]
# Hardware-NVENC H.264 live preview: decodes the Jetson's H.264 byte-stream.
# Only needed when calibration.preview_codec = "h264" (default is "jpeg").
h264 = ["av"]                  # PyAV (bundles ffmpeg) — `pip install av`
# 3D scanning (module #2): TSDF fusion, meshing + plane/oriented-box geometry.
# Imported lazily in tasni/modules/scan/reconstruct.py, so the package still
# imports without it — only a scan Run needs it. `pip install -e .[scan]`.
scan = ["open3d"]              # Open3D — TSDF integrate + marching-cubes + RANSAC plane
# Learned (SAM) live work-boundary for low-contrast scenes (module #2). Host-side ONNX
# inference (the Jetson never runs SAM). Imported lazily in scan/sam_boundary.py, so the
# package imports without it and the classical colour engine still works. Weights are NOT
# shipped in the repo — fetch with `tools/download_sam.py`. `pip install -e .[sam]`.
sam = ["onnxruntime"]          # ONNXRuntime (CPU) — EdgeSAM / MobileSAM encoder+decoder
# Publication + in-app figures rendered from an archived take (extrusion module).
# Imported lazily behind the Agg backend in modules/extrusion/figures.py, so the
# package imports and every measurement still runs without it — only the figures
# are skipped. `pip install -e .[figures]`.
figures = ["matplotlib"]       # plan / height map / oblique / unrolled profile

[project.scripts]
tasni = "tasni.__main__:main"

[tool.setuptools.packages.find]
include = ["tasni*"]
